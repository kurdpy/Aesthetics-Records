*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--ink);font:16px/1.6 Vazirmatn,Tahoma,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:5;background:var(--acc);color:var(--on);display:flex;align-items:center;gap:4px;padding:10px 14px}
header h1{font-size:18px;margin:0;flex:1}header button{background:none;border:0;color:inherit;font:inherit;padding:6px 10px}

.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}

input,select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px}

.no{min-width:42px;font-weight:700;color:var(--acc)}.mut{color:var(--mut);font-size:14px}
.map{position:relative;touch-action:manipulation;border:1px solid var(--line);border-radius:10px;overflow:hidden;direction:ltr}.map img{display:block;width:100%}

pt:i=>go('pat',i),back(){V.n=='visit'?go('pat',VI().patient_id):go('list')},

const hk=s=>String(s).replace(/[\s_\-]/g,'').toLowerCase(),nn=s=>String(s).trim().toLowerCase().replace(/[_\s]+/g,' ');

 const i=D.patients.findIndex(p=>p.patient_id==id);if(i>=0&&!D.patients[i].synced){skip++;continue}

const pts={};SEEN={visits:new Set(),points:new Set()};
for(const o of tab(iv).rows){SEEN.points.add(o.pointid);if(String(o.archived).toUpperCase()=='TRUE'||!o.visitid)continue;(pts[o.visitid]??=[]).push({point_id:o.pointid,visit_id:o.visitid,facial_view:o.facialview||'front',x:parseFloat(o.x)||0,y:parseFloat(o.y)||0,label:o.label||'',procedure_type:o.proceduretype||'',product_id:o.productid||'',product_name:o.productname||'',manufacturer:o.manufacturer||'',amount:o.amount||'',amount_unit:o.amountunit||'',lot_number:o.lotnumber||'',expiry_date:o.expirydate||'',technique:o.technique||'',needle_or_cannula:o.needleorcannula||'',notes:o.notes||'',shape:o.shape||'point',vertices:[],preset_name:o.presetname||'',archived:false,sort_order:parseInt(o.sortorder)||0,created_at:o.createdat||'',updated_at:o.updatedat||''})}
const VF=['visit_id','patient_id','visit_date','face_model','chief_complaint','patient_goals','medical_history','allergies','examination_findings','assessment','treatment_plan','consent_status','procedures_performed','follow_up_plan','adverse_events','clinician_notes','visit_status','created_at','updated_at'];
for(const o of tab(vv).rows){if(!o.visitid)continue;SEEN.visits.add(o.visitid);const i=D.visits.findIndex(v=>v.visit_id==o.visitid);if(i>=0&&!D.visits[i].synced){skip++;continue}
 const v={synced:true,points:(pts[o.visitid]||[]).sort((a,b)=>a.sort_order-b.sort_order)};VF.forEach(f=>v[f]=o[hk(f)]??'');v.face_model=v.face_model||'female';i>=0?D.visits[i]=v:(D.visits.push(v),nv++)}

async function push(){await pull();const hdr=async n=>{try{return((await api('values/'+encodeURIComponent(n+'!1:1'))).values||[[]])[0]}catch(e){return null}};
const H={P:await hdr(C.ps),V:await hdr('Visits'),I:await hdr('InjectionPoints'),A:await hdr('AuditLog')},cols=pcol(H.P||[]);
if(!H.P||!('full_name'in cols)||!('patient_id'in cols))throw 'Patients worksheet or its name/PatientID columns not found.';
if(!H.V||!H.I||!['visitid','patientid','visitdate'].every(k=>H.V.map(hk).includes(k))||!['pointid','visitid','x','y'].every(k=>H.I.map(hk).includes(k)))throw 'Visits / InjectionPoints worksheets are missing or have no proper columns. Run Settings → Prepare Google Sheet on the desktop first.';
const add=(n,rows)=>rows.length?api('values/'+encodeURIComponent(n)+':append?valueInputOption=RAW&insertDataOption=INSERT_ROWS',{method:'POST',body:JSON.stringify({values:rows})}):0;
let np=0,nv=0;const newP=D.patients.filter(p=>!p.synced&&p.full_name.trim());
if(newP.length){await add(C.ps,newP.map(p=>H.P.map((c,i)=>{const f=Object.keys(cols).find(k=>cols[k]==i);return f=='patient_id'?p.patient_id:f=='full_name'?p.full_name:f=='phone'?p.phone:f=='gender'?p.gender:''})));newP.forEach(p=>p.synced=true);np=newP.length;save()}
for(const v of D.visits.filter(v=>!v.synced)){const p=D.patients.find(x=>x.patient_id==v.patient_id);if(!p||!p.synced){log('• Skipped a visit: its patient is not in the sheet.');continue}
 if(SEEN.visits.has(v.visit_id)){v.synced=true;continue}
 const n=now();v.updated_at=n;await add('InjectionPoints',v.points.filter(m=>!SEEN.points.has(m.point_id)).map(m=>rowOf(H.I,{...m,updated_at:n})));   // markers first: the Visits row is what completes the record
 await add('Visits',[rowOf(H.V,v)]);if(H.A)await add('AuditLog',[rowOf(H.A,{audit_id:uid(),timestamp:n,actor:'phone',action:'create',entity_type:'visit',entity_id:v.visit_id,details:'token='+uid()})]);
 v.synced=true;nv++;save()}
log(`✓ Sent ${np} new patients and ${nv} new visits. Existing rows were not changed.`);render()}
